[package]
name = "deadlock"
version = "0.1.4"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Native database IDE for MySQL, MariaDB, Oracle and Redis, built with GPUI."
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow = "1"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
deadlock-core = { path = "../deadlock-core" }
dirs = "6"
# Already in the tree (through deadlock-core): the import's encoding list.
encoding_rs = "0.8"
# Already in the tree through GPUI: rasterises the exported SVG into a PNG.
resvg = { version = "0.46", default-features = false, features = ["text"] }
# Already in the tree through gpui-component: the date picker's values.
jiff = "1"
# Already in the tree through gpui-component: the completion provider's item types.
lsp-types = { version = "0.97", features = ["proposed"] }
gpui-kit = { workspace = true, features = ["component", "assets", "x11", "tree-sitter-sql"] }
rust-embed = "8"
serde_json = "1"
sqlformat = "0.5"
tree-sitter-sequel = "0.3"
tokio = { version = "1", features = ["sync"] }
# Files panel: Delete moves files to the system trash (MIT; adds only urlencoding).
trash = "5"
# Already in the tree through gpui-component: keeps the Files panel in sync with disk.
notify = "8"

[dev-dependencies]
gpui-fps.workspace = true
tempfile = "3"

[lints]
workspace = true
