[workspace]
members = ["crates/deadlock-core", "crates/deadlock"]
# Vendored upstream crates build as dependencies, not members (no lints, opt-level 2).
exclude = ["vendor"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
# gpui-kit is gpui-component's application crate: it re-exports gpui (the
# `gpui-pre` =0.3.12 snapshot pinned by this rev) and gpui-component.
gpui-kit = { git = "https://github.com/longbridge/gpui-component", rev = "1c7e7f7c6c8d6585da909804496614da01bb8663", default-features = false }
gpui-fps = { git = "https://github.com/longbridge/gpui-component", rev = "1c7e7f7c6c8d6585da909804496614da01bb8663" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Debug info is cut down because full debuginfo made target/ grow past 50 GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# Packages ship a stripped binary.
[profile.release]
strip = true

# gpui-base with Deadlock's patches (vendor/gpui-base/PATCHES.md).
[patch."https://github.com/longbridge/gpui-component"]
gpui-base = { path = "vendor/gpui-base" }
