name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem or workflow, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      multiple: true
      options: [MySQL, MariaDB, Oracle, Redis, All]
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
