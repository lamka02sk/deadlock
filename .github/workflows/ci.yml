name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install GPUI system libraries
        run: sudo apt-get update && sudo apt-get install -y clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libvulkan1
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Compiles and tests on macOS, so a break there shows on the push that causes it.
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # macOS package (Apple Silicon) on a tag push, as a workflow artifact.
  package-macos:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check, check-macos]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: packaging/macos/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deadlock-macos-${{ github.ref_name }}
          path: target/package/*.dmg

  # Linux packages on a tag push, as workflow artifacts. Windows packages are not
  # built yet.
  package-linux:
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GPUI system libraries and dpkg-dev
        run: sudo apt-get update && sudo apt-get install -y clang dpkg-dev libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libvulkan1
      - uses: Swatinem/rust-cache@v2
      - run: packaging/linux/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deadlock-linux-${{ github.ref_name }}
          path: |
            target/package/*.deb
            target/package/*.AppImage
