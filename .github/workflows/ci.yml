name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install GPUI system libraries
        run: sudo apt-get update && sudo apt-get install -y clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libvulkan1
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Compiles and tests on macOS, so a break there shows on the push that causes it.
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # macOS package (Apple Silicon) on a tag push, attached to the tag's release.
  package-macos:
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    needs: [check, check-macos]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: packaging/macos/package.sh
      # A tag pushed without a release gets one; the two package jobs may race to
      # create it, so the loser's error is ignored and the upload reports real ones.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --generate-notes 2>/dev/null || true
          gh release upload "$TAG" --clobber target/package/*.dmg

  # Linux packages on a tag push, attached to the tag's release. Windows packages are not
  # built yet.
  package-linux:
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GPUI system libraries and dpkg-dev
        run: sudo apt-get update && sudo apt-get install -y clang dpkg-dev libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libvulkan1
      - uses: Swatinem/rust-cache@v2
      - run: packaging/linux/package.sh
      # A tag pushed without a release gets one; the two package jobs may race to
      # create it, so the loser's error is ignored and the upload reports real ones.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --generate-notes 2>/dev/null || true
          gh release upload "$TAG" --clobber target/package/*.deb target/package/*.AppImage
